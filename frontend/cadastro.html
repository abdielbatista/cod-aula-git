<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - Dashboard IoT</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen">

    <div class="bg-white p-8 rounded-lg shadow-md w-full max-w-md">
        <h2 class="text-2xl font-bold text-center text-gray-800 mb-6">Criar Conta</h2>
        
        <form action="index.html" method="GET">
            <div class="mb-4">
                <label class="block text-gray-700 text-sm font-semibold mb-2">Nome Completo</label>
                <input type="text" placeholder="Seu Nome" required
                    class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>

            <div class="mb-4">
                <label class="block text-gray-700 text-sm font-semibold mb-2">E-mail</label>
                <input type="email" placeholder="seu@email.com" required
                    class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>

            <div class="mb-6">
                <label class="block text-gray-700 text-sm font-semibold mb-2">Senha</label>
                <input type="password" placeholder="********" required
                    class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>

            <button type="submit" 
                class="w-full bg-green-600 text-white font-semibold py-2 rounded-lg hover:bg-green-700 transition">
                Cadastrar e Entrar
            </button>
        </form>

        <p class="text-center text-sm text-gray-600 mt-4">
            Já tem uma conta? 
            <a href="login.html" class="text-blue-600 font-semibold hover:underline">Faça Login</a>
        </p>
    </div>

</body>
</html>
