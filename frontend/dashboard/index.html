<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - SensorIoT</title>

    <!-- Tailwind CSS via CDN -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Chart.js para renderizar os gráficos -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <!-- FontAwesome para os ícones -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

</head>
<body class="bg-gray-100 flex min-h-screen">

    <!-- MENU LATERAL (SIDEBAR COM VERDE MAIS CLARO) -->
    <aside class="w-64 bg-green-500 flex flex-col justify-between p-4 text-white">
        <div>
            <h1 class="text-xl font-bold mb-8 flex items-center gap-2">
                SensorIoT
            </h1>
            <nav class="space-y-2">
                <a href="index.html" class="flex items-center gap-3 p-2 rounded-lg bg-green-600 font-semibold">
                    <i class="fa-solid fa-house"></i> Dashboard
                </a>
                <a href="login.html" class="flex items-center gap-3 p-2 rounded-lg hover:bg-green-600 transition">
                    <i class="fa-solid fa-right-from-bracket"></i> Sair / Login
                </a>
            </nav>
        </div>
    </aside>

    <!-- CONTEÚDO PRINCIPAL -->
    <main class="flex-1 p-8">
        
        <!-- Cabeçalho -->
        <header class="mb-6 bg-white p-4 rounded-lg shadow flex items-center justify-between">
            <div class="flex items-center gap-3">
                <i class="fa-solid fa-chart-line text-gray-800 text-xl"></i>
                <h1 class="text-2xl font-bold text-gray-800">Dashboard IoT (Dados do MySQL)</h1>
            </div>
            
             <!-- Status que muda via JS -->
            <span id="connectionBadge" class="px-3 py-1 bg-yellow-100 text-yellow-800 rounded-full text-sm font-semibold flex items-center gap-2">
                <span class="w-2 h-2 rounded-full bg-yellow-800 animate-pulse"></span> Conectando
            </span>

        </header>

        <!-- Cards de Indicadores (Temperatura e Umidade Atuais) -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-6">
            <div class="bg-white p-4 rounded-lg shadow border-l-4 border-blue-500">
                <p class="text-gray-500 text-sm">Temperatura Atual</p>
                <h2 id="currentTemp" class="text-3xl font-bold text-gray-800">-- °C</h2>
            </div>
            <div class="bg-white p-4 rounded-lg shadow border-l-4 border-green-500">
                <p class="text-gray-500 text-sm">Umidade Atual</p>
                <h2 id="currentHum" class="text-3xl font-bold text-gray-800">-- %</h2>
            </div>
        </div>

        <!-- Área do Gráfico e Tabela com espaçamento (space-y-6) -->
        <div class="flex flex-col space-y-6">

            <!-- Área do Gráfico -->
            <div class="bg-white p-6 rounded-lg shadow">
                <h3 class="text-lg font-semibold mb-4 text-gray-700">Histórico de Leituras em Tempo Real</h3>
                <div class="relative h-80">
                    <canvas id="sensorChart"></canvas>
                </div>
            </div>

            <div class="bg-white p-6 rounded-lg shadow flex flex-col">
                <h3 class="text-lg font-semibold mb-4 text-gray-700">Últimos Registros</h3>
                <div class="overflow-x-auto flex-1">
                    <table class="w-full text-left text-sm text-gray-600">
                        <thead class="bg-gray-50 uppercase text-xs text-gray-700">
                            <tr>
                                <th class="p-2">Temp</th>
                                <th class="p-2">Umi</th>
                                <th class="p-2">Horário</th>
                            </tr>
                        </thead>
                        <tbody id="historyTableBody">
                            <tr>
                                <td colspan="3" class="p-4 text-center text-gray-400">Aguardando dados...</td>
                            </tr>
                        </tbody>

                    </table>
                </div>

            </div>

        </div>
            

        

    </main>

    <!-- Importa o arquivo script.js para controlar o gráfico -->
    <script src="../script.js"></script>
</body>
</html>
